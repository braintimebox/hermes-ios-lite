name: Build unsigned IPA
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build archive unsigned
        run: |
          xcodebuild archive             -project HermesLite.xcodeproj             -scheme HermesLite             -archivePath ./build/HermesLite.xcarchive             -destination 'generic/platform=iOS'             -configuration Release             CODE_SIGN_IDENTITY=""             CODE_SIGNING_REQUIRED=NO             CODE_SIGNING_ALLOWED=NO             DEVELOPMENT_TEAM=""
      - name: Package IPA
        run: |
          APP_DIR=$(find ./build/HermesLite.xcarchive -name "HermesLite.app" -type d | head -1)
          test -n "$APP_DIR"
          mkdir -p Payload
          cp -R "$APP_DIR" Payload/
          zip -r HermesLite-0.5.1-unsigned.ipa Payload > /dev/null
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: HermesLite-0.5.1-unsigned
          path: HermesLite-0.5.1-unsigned.ipa
          retention-days: 30
